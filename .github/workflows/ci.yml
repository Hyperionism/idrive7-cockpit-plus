name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build stub-SDK package for test harness
        run: python3 vendor/cauliflowermossgrape-idrive7-apps/kit/tools/build.py --app-root . --stub-sdk id7_cockpit_plus

      - name: Run automated test suite
        env:
          REQUIRE_DIST: "1"
        run: |
          node test/run_tests.js
          node test/fullview_companion_test.js

      - name: Dry-run no-SDK release build & catalog check
        run: |
          rm -rf dist/
          node release/build_catalog.js --repo "${{ github.repository }}" --dry-run
