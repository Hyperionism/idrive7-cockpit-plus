name: Build and Publish MGU Store Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (leave blank to auto-use v<version> from app.json)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
      - "id7_cockpit_plus@*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine release version, tag & pinned upstream SHAs
        id: meta
        run: |
          VER=$(node -e "console.log(require('./apps/id7_cockpit_plus/app.json').version)")
          IDRIVE_SHA=$(node -e "console.log(require('./native/fullview-patch.js').UPSTREAM_PINS.idriveAppsCommit)")
          MGU_STORE_SHA=$(node -e "console.log(require('./native/fullview-patch.js').UPSTREAM_PINS.mguStoreCommit)")
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VER}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "idrive_sha=$IDRIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "mgu_store_sha=$MGU_STORE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release version=$VER tag=$TAG repo=${{ github.repository }}"

      - name: Stamp repository link & build stub-SDK test bundle
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/id7_cockpit_plus/app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.repoLink = 'github.com/${{ github.repository }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          python3 vendor/cauliflowermossgrape-idrive7-apps/kit/tools/build.py --app-root . --stub-sdk id7_cockpit_plus

      - name: Run full local verification suite
        env:
          REQUIRE_DIST: "1"
        run: |
          node test/run_tests.js
          node test/fullview_companion_test.js

      - name: Fetch, patch & build open-source native MGU components (cluster-render, waze-on-cluster, mgu-render)
        run: |
          rm -rf /tmp/up && mkdir -p /tmp/up
          git clone -q https://github.com/robertnisipeanu/idrive-apps.git /tmp/up/idrive-apps
          git -C /tmp/up/idrive-apps checkout -q -B main "${{ steps.meta.outputs.idrive_sha }}"

          git clone -q https://github.com/robertnisipeanu/mgu-store.git /tmp/up/mgu-store
          git -C /tmp/up/mgu-store checkout -q -B main "${{ steps.meta.outputs.mgu_store_sha }}"

          node native/fullview-patch.js --idrive-apps /tmp/up/idrive-apps --mgu-store /tmp/up/mgu-store

          git -C /tmp/up/idrive-apps -c user.name="ci" -c user.email="ci@local" commit -q -am "Apply Cockpit+ FullView 1632x720 patch"
          git -C /tmp/up/mgu-store -c user.name="ci" -c user.email="ci@local" commit -q --allow-empty -am "Prepare mgu-render release"

          # Verify C++ & patch unit tests after applying FullView patches
          make -C /tmp/up/idrive-apps/native/cluster-render test
          make -C /tmp/up/idrive-apps/native/waze-on-cluster test

          # Build head-unit Ubuntu 18.04 Docker targets & MGU Store tarballs (retry on transient Ubuntu 18.04 apt mirror errors)
          for attempt in 1 2 3; do
            if (cd /tmp/up/idrive-apps && node release/release.js build cluster-render waze-on-cluster robertn_waze_cluster); then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            echo "::warning::idrive-apps Docker build attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done

          MGU_RENDER_OK=0
          for attempt in 1 2 3; do
            if (cd /tmp/up/mgu-store && node release/release.js build mgu-render); then
              MGU_RENDER_OK=1
              break
            fi
            echo "::warning::Optional mgu-render Docker build attempt ${attempt} failed (likely Ubuntu 18.04 apt mirror hiccup); retrying in 5s..."
            sleep 5
          done
          if [ "$MGU_RENDER_OK" -eq 0 ]; then
            echo "::warning::Skipping optional mgu-render after 3 failed attempts; core Cockpit+ FullView suite is unaffected."
          fi
          ls -lh /tmp/up/idrive-apps/release/out
          [ -d /tmp/up/mgu-store/release/out ] && ls -lh /tmp/up/mgu-store/release/out || true

      - name: Build unified no-SDK release packages & Schema 2 catalog
        run: |
          rm -rf dist/
          EXTRA_CATS="/tmp/up/idrive-apps/release/out/catalog.json"
          if [ -f "/tmp/up/mgu-store/release/out/catalog.json" ]; then
            EXTRA_CATS="${EXTRA_CATS},/tmp/up/mgu-store/release/out/catalog.json"
          fi
          node release/build_catalog.js \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --extra-catalog "${EXTRA_CATS}"
          ls -lh dist/

      - name: Create or update versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.version }}"
          ASSETS=(dist/*.tgz dist/*.png dist/mgu-store.json dist/catalog.json)
          CR_VER=$(node -e "console.log(require('./native/fullview-patch.js').UPSTREAM_PINS.clusterRenderVersion)")
          WOC_VER=$(node -e "console.log(require('./native/fullview-patch.js').UPSTREAM_PINS.wazeOnClusterVersion)")
          NOTES="Cockpit+ v${VER} full open-source FullView 1632x720 suite for BMW iDrive 7 (cluster-render ${CR_VER} + waze-on-cluster ${WOC_VER} + robertn_waze_cluster 0.6.17 + mgu-render 0.6.26 + cockpit-fullview 1.0.0 + id7_cockpit_plus ${VER}). Zero paid components required."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Cockpit+ v${VER} (FullView Stack)" --notes "$NOTES"
          fi

      - name: Create or update floating catalog release for MGU Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ICONS=(dist/*.png)
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog dist/catalog.json "${ICONS[@]}" --clobber
          else
            gh release create catalog dist/catalog.json "${ICONS[@]}" --title "Cockpit+ MGU Store Catalog" --notes "Unified Schema 2 catalog for MGU Store (Releases feed)."
          fi
