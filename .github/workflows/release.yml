name: Build and Publish MGU Store Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (leave blank to auto-use v<version> from app.json)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
      - "id7_cockpit_plus@*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine release version & tag
        id: meta
        run: |
          VER=$(node -e "console.log(require('./apps/id7_cockpit_plus/app.json').version)")
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VER}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version=$VER tag=$TAG repo=${{ github.repository }}"

      - name: Stamp repository link & build stub-SDK test bundle
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/id7_cockpit_plus/app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.repoLink = 'github.com/${{ github.repository }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          python3 vendor/cauliflowermossgrape-idrive7-apps/kit/tools/build.py --app-root . --stub-sdk id7_cockpit_plus

      - name: Run full verification suite before publishing
        env:
          REQUIRE_DIST: "1"
        run: |
          node test/run_tests.js
          node test/fullview_companion_test.js

      - name: Build clean no-SDK release packages & Schema 2 catalog
        run: |
          rm -rf dist/
          node release/build_catalog.js --repo "${{ github.repository }}" --tag "${{ steps.meta.outputs.tag }}"
          ls -lh dist/

      - name: Create or update versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.version }}"
          APP_TGZ="dist/id7_cockpit_plus@${VER}.tgz"
          TOOL_VER=$(node -e "console.log(require('./tools/cockpit-fullview/component.json').version)")
          TOOL_TGZ="dist/cockpit-fullview@${TOOL_VER}.tgz"
          NOTES="Cockpit+ v${VER} (id7_cockpit_plus) + Cockpit+ FullView Companion ${TOOL_VER} (cockpit-fullview) for BMW iDrive 7 (ID7 / KOMBI4 + HUD). Pure 1632x720 FullView CarPlay/AMAP/Baidu map + zero-overlap Cockpit+ overlays."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APP_TGZ" "$TOOL_TGZ" dist/mgu-store.json dist/catalog.json dist/id7_cockpit_plus.png --clobber
          else
            gh release create "$TAG" "$APP_TGZ" "$TOOL_TGZ" dist/mgu-store.json dist/catalog.json dist/id7_cockpit_plus.png --title "Cockpit+ v${VER}" --notes "$NOTES"
          fi

      - name: Create or update floating catalog release for MGU Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog dist/catalog.json dist/id7_cockpit_plus.png --clobber
          else
            gh release create catalog dist/catalog.json dist/id7_cockpit_plus.png --title "Cockpit+ MGU Store Catalog" --notes "Floating Schema 2 catalog for MGU Store (Releases feed)."
          fi
